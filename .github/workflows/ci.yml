name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API - lint & test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup up node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install
      
      - name: Run unit tests
        run: npm test
      
      - name: Run lint tests
        run: npm run lint

      - name: Run e2e tests
        run: npm run test:e2e
      
      #- name: Run BDD tests
      #  run: npm run test:bdd